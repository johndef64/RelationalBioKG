# Base conda environment for RelationalPKT (Python only).
# PyTorch + PyG must match the machine's CUDA version, so the complete, verified setup is:
#   bash create_env.sh
# This file is kept for tools that expect an environment.yml; it does NOT install torch/PyG.
name: gnn
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
